name: 🚀 Deploy .NET 8 Web API to IIS on VPS

on:
  push:
    branches: [ "main" ]  # Chạy khi có push vào nhánh main

jobs:
  build-and-deploy:
    runs-on: [self-hosted, windows]  # VPS có GitHub runner tự host

    env:
      PUBLISH_PATH: "C:\\inetpub\\wwwroot\\aievent"  # Đường dẫn publish đến IIS

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v3

      - name: 🔐 Import .env to Windows Environment Variables (Machine)
        shell: powershell
        run: |
          $envFile = "$GITHUB_WORKSPACE\.env"

          if (!(Test-Path $envFile)) {
            Write-Error ".env file not found at $envFile"
            exit 1
          }

          Get-Content $envFile |
          Where-Object { $_ -and $_ -notmatch '^#' } |
          ForEach-Object {
              $pair = $_ -split '=', 2
              if ($pair.Length -eq 2) {
                  $name = $pair[0].Trim()
                  $value = $pair[1].Trim()
                  [Environment]::SetEnvironmentVariable($name, $value, "Machine")
                  Write-Host "Imported env: $name"
              }
          }

      - name: 🔄 Restart IIS to apply env variables
        shell: powershell
        run: |
          iisreset

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore NuGet packages
        run: dotnet restore ./Backend/AIEvent/src/AIEvent.API/AIEvent.API.csproj

      - name: 🛑 Stop IIS AppPool before cleaning
        shell: powershell
        run: |
          Import-Module WebAdministration
          $appPoolPath = "IIS:\AppPools\AIEventAPI"
          if (Test-Path $appPoolPath) {
            $appPool = Get-Item $appPoolPath
            if ($appPool.State -ne "Stopped") {
              $appPool.Stop()
              Write-Host "AppPool 'AIEventAPI' has been stopped."
            } else {
              Write-Host "AppPool 'AIEventAPI' was already stopped."
            }
          } else {
            Write-Host "AppPool 'AIEventAPI' does not exist."
          }

      - name: 🧹 Clean old publish directory
        shell: powershell
        run: |
          if (Test-Path "$env:PUBLISH_PATH") {
            Remove-Item -Recurse -Force "$env:PUBLISH_PATH\*" -ErrorAction SilentlyContinue
            Write-Host "Old files deleted from publish folder."
          } else {
            New-Item -Path "$env:PUBLISH_PATH" -ItemType Directory | Out-Null
            Write-Host "Created new publish folder."
          }

      - name: 🛠️ Build and Publish to IIS path
        run: |
          dotnet publish ./Backend/AIEvent/src/AIEvent.API/AIEvent.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o "$env:PUBLISH_PATH"

      - name: 🔁 Restart IIS AppPool for AIEventAPI
        shell: powershell
        run: |
          Import-Module WebAdministration
          $appPoolPath = "IIS:\AppPools\AIEventAPI"
          if (Test-Path $appPoolPath) {
            $appPool = Get-Item $appPoolPath
            $appPool.Start()
            Write-Host "AppPool 'AIEventAPI' restarted."
          } else {
            Write-Host "AppPool 'AIEventAPI' does not exist."
          }

      - name: ✅ Verify publish result
        shell: powershell
        run: |
          Write-Host "Files published to: $env:PUBLISH_PATH"
          Get-ChildItem "$env:PUBLISH_PATH" -Recurse
